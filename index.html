<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chronological Bible Engine v1.22 (Shekinah)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --parchment-bg: #1a1a1a; }
        .font-serif { font-family: 'Noto Serif', serif !important; }
        .verdana-font { font-family: Verdana, Geneva, Tahoma, sans-serif; }
        body { overflow-x: hidden; width: 100%; background-color: #09090b; }
        .silver-table { background-color: #1a1a1a; background-image: radial-gradient(#333 1px, transparent 0); background-size: 20px 20px; transition: background 0.5s; max-width: 100vw; overflow-x: hidden; min-height: 100vh; }
        .parchment { background-color: var(--parchment-bg); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); position: relative; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); color: #f8fafc !important; }
        .section-label { color: #60a5fa; font-weight: 900; font-size: calc(clamp(2rem, 4vw, 3rem) * var(--text-scale, 1)); text-align: center; line-height: 1.1; }
        .subsection-label { color: #93c5fd; font-weight: 800; font-size: calc(clamp(1.4rem, 2.5vw, 1.8rem) * var(--text-scale, 1)); text-align: center; opacity: 0.8; }
        .title-label { color: #34d399; font-weight: 800; font-size: calc(clamp(1.2rem, 2vw, 1.5rem) * var(--text-scale, 1)); text-align: center; }
        .subtitle-label { color: #6ee7b7; font-weight: 700; font-size: calc(clamp(1rem, 1.5vw, 1.15rem) * var(--text-scale, 1)); text-align: center; opacity: 0.7; }
        .gradient-bar-section { height: 4px; width: 60%; margin: 1.5rem auto; background: linear-gradient(to right, #2563eb, #7e22ce, #dc2626); border-radius: 99px; }
        .gradient-bar-title { height: 2px; width: 35%; margin: 1rem auto; background: linear-gradient(to right, #2563eb, #7e22ce, #dc2626); border-radius: 99px; }
        .chronological-label { color: #fde68a; font-weight: 700; font-size: calc(0.95rem * var(--text-scale, 1)); text-align: center; margin-bottom: 0.5rem; }
        .references-label { color: #1e3a8a; font-weight: 700; font-size: calc(1rem * var(--text-scale, 1)); text-align: center; }
        .ref-purple { color: #c084fc; font-weight: 800; }
        .bible-text { font-size: calc(1.2rem * var(--text-scale, 1)); line-height: 2; color: #f8fafc; text-align: justify; }
        .verse-marker { color: #c084fc; font-weight: 800; vertical-align: super; font-size: 0.65em; margin-right: 4px; }
        .footnote-marker { color: #94a3b8; vertical-align: sub; font-size: 0.65em; font-weight: bold; cursor: pointer; padding: 0 2px; opacity: 0.6; }
        .verse-wrapper { display: inline; padding: 2px 4px; margin: 0 -4px; border-radius: 6px; transition: background 0.3s, box-shadow 0.3s; -webkit-box-decoration-break: clone; box-decoration-break: clone; position: relative; }
        .verse-highlight-active:hover { background: rgba(56, 189, 248, 0.2); }
        .verse-selected { background: rgba(234, 179, 8, 0.3); box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.5); z-index: 10; }
        .selection-mode-active .verse-wrapper { cursor: pointer; }
        .selection-mode-active .verse-wrapper:hover { background: rgba(234, 179, 8, 0.1); }
        .lexical-token { transition: all 0.2s; cursor: pointer; border-bottom: 2px solid transparent; }
        .lexical-active { border-bottom-color: #3b82f6; text-decoration: underline; text-underline-offset: 4px; }
        @keyframes starlightGlow { 0%, 100% { text-shadow: 0 0 4px rgba(255, 255, 255, 0.4), 0 0 8px rgba(147, 197, 253, 0.2); } 50% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(147, 197, 253, 0.5); } }
        .divine-name-styled { font-weight: 800; color: #ffffff; animation: starlightGlow 6s infinite ease-in-out; display: inline-block; }
        .divine-quote-styled { color: #fda4af; font-weight: 600; animation: starlightGlow 6s infinite ease-in-out; }
        @keyframes shekinahShimmer { 0% { background-position: 0% 50%; } 100% { background-position: 200% 50%; } }
        @keyframes shekinahPulse { 0% { filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.6)); transform: scale(1); } 100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9)); transform: scale(1.03); } }
        .shekinah-mode .parchment { box-shadow: 0 0 80px rgba(255, 215, 0, 0.15); border: 1px solid rgba(255, 215, 0, 0.2); }
        .shekinah-mode .divine-name-styled { background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c); background-size: 200% auto; color: transparent !important; -webkit-background-clip: text; background-clip: text; animation: shekinahShimmer 4s linear infinite, shekinahPulse 3s infinite alternate !important; font-weight: 900; text-shadow: none !important; }
        .glass-header { background: rgba(24, 24, 27, 0.8); border-bottom: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(12px); }
        .glass-footer { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
        .details-panel { position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 100%; background: rgba(24, 24, 27, 0.95); backdrop-filter: blur(16px); box-shadow: -10px 0 30px rgba(0,0,0,0.1); z-index: 190; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); border-left: 1px solid rgba(255,255,255,0.05); color: #f8fafc; }
        @media (min-width: 768px) { .details-panel { max-width: 28rem; } }
        .details-content { height: 100%; overflow-y: auto; padding: 2rem; }
        .rich-content { color: #e2e8f0 !important; }
        .rich-content :is(p, li, span, td, th) { color: inherit; }
        .rich-content h3 { font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem; color: #60a5fa !important; }
        .rich-content ul { list-style-type: disc !important; padding-left: 1.5rem !important; margin-bottom: 1rem; }
        .rich-content li { margin-bottom: 0.25rem; display: list-item !important; }
        .rich-content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; font-size: 0.9rem; }
        .rich-content th, .rich-content td { border: 1px solid #3f3f46; padding: 0.5rem; text-align: left; }
        .rich-content th { background-color: #27272a; color: #f8fafc !important; font-weight: 700; }
        .rich-content blockquote { border-left: 4px solid #60a5fa; padding-left: 1rem; font-style: italic; color: #94a3b8 !important; margin: 1rem 0; background: #27272a; padding: 1rem; border-radius: 0 0.5rem 0.5rem 0; }
        .atlas-modal { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; overflow: hidden; }
        .image-viewer { position: fixed; inset: 0; z-index: 210; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; }
        .video-viewer { position: fixed; inset: 0; z-index: 210; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; padding: 20px; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .search-result-active { background: #ec4899 !important; color: white !important; box-shadow: 0 0 10px #ec4899, 0 0 20px #ec4899; z-index: 20; position: relative; transition: all 0.3s; }
    </style>
</head>
<body class="antialiased select-none bg-zinc-950 text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useContext, createContext, useRef, useMemo, useCallback } = React;

        const AppContext = createContext();

        const Icons = {
            Calendar: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
            Compass: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="m16.2 7.8-2 2"/><path d="m7.8 16.2 2-2"/><path d="M12 12h.01"/><path d="M14.89 14.89 12 12"/><path d="M12 12 9.11 9.11"/></svg>,
            Left: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>,
            Right: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m9 18 6-6-6-6"/></svg>,
            Up: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m18 15-6-6-6 6"/></svg>,
            Down: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m6 9 6 6 6-6"/></svg>,
            Scroll: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/></svg>,
            Search: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
            Image: ({className}) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className || "text-emerald-500 cursor-pointer hover:scale-110 transition-transform"}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>,
            Film: ({className}) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className || "text-rose-500 cursor-pointer hover:scale-110 transition-transform"}><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg>,
            ZoomIn: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>,
            ZoomOut: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg>,
            CheckList: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Copy: ({className}) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
            X: ({className}) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Spark: ({className}) => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className || "text-amber-500"}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>,
            Home: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
            Settings: ({className}) => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        };

        const smartFetch = async (url, type, updateStatus) => {
            try {
                let resolvedUrl = url;
                try { resolvedUrl = new URL(url, document.baseURI || window.location.href).href; } catch (e) {}
                const urlWithCacheBuster = `${url}?t=${new Date().getTime()}`;
                const response = await fetch(urlWithCacheBuster);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                updateStatus(prev => ({ ...prev, [type]: 'LIVE' }));
                return data;
            } catch (e) {
                console.error(`[SmartFetch] Critical Error loading ${url}:`, e);
                updateStatus(prev => ({ ...prev, [type]: 'ERROR' }));
                throw e; 
            }
        };

        const useTokenization = () => {
            const context = useContext(AppContext);
            if (!context) return { tokenize: (s) => s };
            const { settings, dicts, setDetail, hoveredStrong, setHoveredStrong, setNetworkStatus, searchQuery } = context;

            const substitute = (type, key) => {
                try {
                    const map = dicts[type];
                    const mode = settings.lang[type];
                    if (!map || !mode) return key;
                    const val = map[key]?.[mode];
                    return (typeof val === 'string') ? val : key;
                } catch (e) { return key; }
            };

            const highlightSearch = (text) => {
                if (typeof text !== 'string') return "";
                if (!searchQuery || searchQuery.length < 2) return text;
                try {
                    const parts = text.split(new RegExp(`(${searchQuery})`, 'gi'));
                    return parts.map((part, i) => part.toLowerCase() === searchQuery.toLowerCase() ? <span key={i} className="bg-yellow-800 text-white rounded px-0.5 search-result">{part}</span> : part);
                } catch (e) { return text; }
            };

            const tokenize = (str, footnotes) => {
                if (typeof str !== 'string') return null;
                const regex = /<(dn\d*|dq|chr|pn\d+|kw\d+)>([\s\S]*?)<\/\1>|<([hg]\d+)>([\s\S]*?)<\/\3>|(\[.*?\])|\{([\w:.]+)\}|<img:([^>]+)>|<vid:([^>]+)>|<(i|b|u|sup|sub)>(.*?)<\/\9>/g;
                const pieces = str.split(regex);
                const elements = [];

                for (let i = 0; i < pieces.length; i += 11) {
                    const textSegment = pieces[i];
                    if (textSegment) elements.push(highlightSearch(textSegment));
                    
                    if (pieces[i+1]) {
                        const rawTag = pieces[i+1], inner = pieces[i+2];
                        let label = inner, tagType = rawTag.substring(0, 2); 
                        if (rawTag === 'chr') tagType = 'chr';
                        if (tagType === 'dn') { if (rawTag === 'dn') { label = inner; } else { label = substitute(tagType, rawTag); } } 
                        else if (tagType === 'pn' || tagType === 'kw') { label = substitute(tagType, rawTag); }
                        const cls = { dn: settings.power.shekinah ? 'divine-name-styled' : '', dq: settings.power.divineQuote ? 'divine-quote-styled' : '', chr: 'char-tag text-emerald-600 font-bold', pn: 'pn-tag text-blue-400 font-bold', kw: 'font-bold' };
                        const safeLabel = typeof label === 'string' ? label : "";
                        elements.push(<span key={`tag-${i}`} className={cls[tagType] || ''}>{tokenize(safeLabel, footnotes)}</span>);
                    }
                    if (pieces[i+3]) {
                        const sid = pieces[i+3].toUpperCase(), inner = pieces[i+4];
                        const safeInner = typeof inner === 'string' ? inner : "";
                        elements.push(<span key={`str-${i}`} className={`lexical-token ${hoveredStrong === sid ? 'lexical-active' : ''}`} onMouseEnter={() => settings.power.lexical && setHoveredStrong(sid)} onMouseLeave={() => setHoveredStrong(null)} onClick={async (e) => { e.stopPropagation(); try { const data = await smartFetch(`data/strongs/${sid}.json`, `Lexicon Data`, setNetworkStatus); setDetail({ type: 'strongs', data }); } catch(e) { setDetail({ type: 'strongs', data: { lemma: sid, transliteration: "---", definition: "Definition pending...", usage: "This lexical entry has not yet been digitized." } }); } }}>{tokenize(safeInner, footnotes)}</span>);
                    }
                    if (pieces[i+5]) { if (settings.power.verseMarkers) elements.push(<span key={`v-${i}`} className="verse-marker">{pieces[i+5]}</span>); }
                    if (pieces[i+6]) { const fid = pieces[i+6]; if (settings.power.footnoteMarkers) elements.push(<span key={`fn-${i}`} className="footnote-marker" onClick={(e) => { e.stopPropagation(); setDetail({ type: 'footnote', data: footnotes ? footnotes[fid] : fid }) }}>{"{" + fid + "}"}</span>); }
                    if (pieces[i+7]) { if (settings.power.imageMarkers) { const imgFile = pieces[i+7]; elements.push(<button key={`img-${i}`} className="inline-flex mx-1 align-text-bottom" onClick={(e) => { e.stopPropagation(); setDetail({ type: 'image', data: imgFile }) }}><Icons.Image /></button>); } }
                    if (pieces[i+8]) { if (settings.power.videoMarkers) { const vidId = pieces[i+8]; elements.push(<button key={`vid-${i}`} className="inline-flex mx-1 align-text-bottom" onClick={(e) => { e.stopPropagation(); setDetail({ type: 'video', data: vidId }) }}><Icons.Film /></button>); } }
                    if (pieces[i+9]) {
                        const tag = pieces[i+9], content = pieces[i+10], key = `ed-${i}`, safeContent = typeof content === 'string' ? content : "";
                        switch(tag) {
                            case 'i': elements.push(<span key={key} className="italic text-gray-400">{highlightSearch(safeContent)}</span>); break;
                            case 'b': elements.push(<b key={key} className="font-bold">{highlightSearch(safeContent)}</b>); break;
                            case 'u': elements.push(<u key={key} className="underline underline-offset-4">{highlightSearch(safeContent)}</u>); break;
                            case 'sup': elements.push(<sup key={key}>{highlightSearch(safeContent)}</sup>); break;
                            case 'sub': elements.push(<sub key={key}>{highlightSearch(safeContent)}</sub>); break;
                            default: elements.push(<span key={key}>{highlightSearch(safeContent)}</span>);
                        }
                    }
                }
                return elements;
            };
            return { tokenize };
        };

        const Verse = ({ id, content, footnotes }) => {
            const { settings, selectionMode, selectedVerses, toggleVerseSelection, searchQuery } = useContext(AppContext);
            const { tokenize } = useTokenization();
            const isSelected = selectedVerses.has(id);
            const handleClick = (e) => { if (selectionMode) { e.stopPropagation(); toggleVerseSelection(id); } };
            const renderedContent = useMemo(() => tokenize(content, footnotes), [content, footnotes, settings.lang, settings.power, searchQuery]);
            return <span className={`verse-wrapper ${settings.power.verseHighlight && !selectionMode ? 'verse-highlight-active' : ''} ${isSelected ? 'verse-selected' : ''}`} onClick={handleClick}>{renderedContent}</span>;
        };

        const Toast = ({ message, isVisible }) => {
            if (!isVisible) return null;
            return (
                <div className="fixed bottom-24 left-1/2 -translate-x-1/2 z-[300] pointer-events-none transition-all duration-500 animate-in slide-in-from-bottom-4 fade-in">
                    <div className="bg-zinc-900/95 backdrop-blur-xl text-slate-100 px-6 py-4 rounded-full shadow-[0_10px_40px_-10px_rgba(0,0,0,0.5)] border border-white/10 flex items-center gap-4">
                        <div className="bg-emerald-500/20 p-2 rounded-full text-emerald-400"><Icons.CheckList className="w-4 h-4" /></div>
                        <span className="font-bold text-sm tracking-wide">{message}</span>
                    </div>
                </div>
            );
        };

        const SettingsModal = ({ isOpen, onClose }) => {
            const { settings, setSettings, networkStatus } = useContext(AppContext);
            if (!isOpen) return null;

            const updatePower = (key) => setSettings(s => ({...s, power: {...s.power, [key]: !s.power[key]}}));
            const cycleLang = (key, opts) => setSettings(s => { const cur = s.lang[key]; const next = opts[(opts.indexOf(cur) + 1) % opts.length]; return {...s, lang: {...s.lang, [key]: next}}; });
            const adjustFontSize = (delta) => setSettings(prev => ({ ...prev, fontSize: Math.min(2.0, Math.max(0.9, parseFloat((prev.fontSize + delta).toFixed(1)))) }));

        const ImageViewer = ({ file, onClose }) => {
            const [scale, setScale] = useState(1);
            const [currentIndex, setCurrentIndex] = useState(0);
            const images = useMemo(() => { if (!file) return []; return file.split(',').map(s => s.trim()); }, [file]);
            useEffect(() => { setScale(1); setCurrentIndex(0); }, [file]);
            useEffect(() => {
                const handleKey = (e) => {
                    if (images.length > 1) {
                        if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); setCurrentIndex(prev => (prev === 0 ? images.length - 1 : prev - 1)); }

                    }

                window.addEventListener('keydown', handleKey); return () => window.removeEventListener('keydown', handleKey);
            }, [images.length]);
            if (!images.length) return null;
            return (

                                {images.length > 1 && (

                                )}

                            <div className="mt-6 flex flex-col items-center gap-3 w-full max-w-2xl">
                                <div className="text-sm font-bold text-white/90 bg-black/60 px-6 py-2 rounded-full backdrop-blur border border-white/10 text-center truncate w-full">{images[currentIndex]}</div>

        const VideoViewer = ({ videoId, onClose }) => {

            return (
                <div className="video-viewer" onClick={onClose}>
