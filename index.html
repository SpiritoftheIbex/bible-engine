        /* Standard Labels - Dark Mode Only */
        .section-label { color: #60a5fa; font-weight: 900; font-size: clamp(2rem, 4vw, 3rem); text-align: center; line-height: 1.1; }
        .subsection-label { color: #93c5fd; font-weight: 800; font-size: clamp(1.4rem, 2.5vw, 1.8rem); text-align: center; opacity: 0.8; }
        
        .title-label { color: #34d399; font-weight: 800; font-size: clamp(1.2rem, 2vw, 1.5rem); text-align: center; }

        .bible-text { font-size: 1.2rem; line-height: 2; color: #f8fafc; text-align: justify; }

        /* Standard Glow Animations */
        @keyframes starlightGlow {

        /* --- SHEKINAH FUSION --- */
        @keyframes shekinahShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        @keyframes shekinahPulse {
            0% { filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.6)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.9)); transform: scale(1.03); }
        }

        .shekinah-mode .parchment {
             box-shadow: 0 0 80px rgba(255, 215, 0, 0.15);

        }

            background: linear-gradient(90deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);

            -webkit-background-clip: text;
            background-clip: text;
            animation: shekinahShimmer 4s linear infinite, shekinahPulse 3s infinite alternate !important;

            text-shadow: none !important;
        }

        .rich-content blockquote { border-left: 4px solid #60a5fa; padding-left: 1rem; font-style: italic; color: #94a3b8 !important; margin: 1rem 0; background: #27272a; padding: 1rem; border-radius: 0 0.5rem 0.5rem 0; }

					  "text": "[Genesis 1:1] <h7225>In <i>the</i> beginning</h7225> <dn2>Elohim</dn2> created <dn7>את</dn7> the heavens and <dn7>את</dn7> the earth. {1.1} <vid:85BLkCl3L08?start=1> [2] Now the earth was formless and empty, and darkness was on the face of the deep. <img:0001.jpg> And the Spirit of <dn2>Elohim</dn2> was vibrating on the face of the waters. <img:0002.jpg> [3] And <dn2>Elohim</dn2> said, <dq>“light come to be,”</dq> and light came to be. [4] And <dn2>Elohim</dn2> saw <dn7>את</dn7> the light, that <i>it was</i> <kw1>good</kw1>. And <dn2>Elohim</dn2> separated the light from the darkness. [5] And <dn2>Elohim</dn2> called the light <dq>‘a <kw2>day</kw2>’</dq> and the darkness <dn9>He</dn9> called <dq>‘a night.’</dq> And there came to be evening and there came to be morning, <kw3>one day</kw3>.{5.1}",
					  "footnotes": {
						"1.1": "<h3>The Nature of Elohim</h3><p>The term <b style='color:#00FFFF'>Elohim</b> here is the plural of <i>Eloah</i>, yet it is used with the singular verb <span style='font-variant:small-caps'>Bara</span> (created). This grammatical construct signifies:</p><ul><li><b>The Unity:</b> One singular entity acting.</li><li><b>The Majesty:</b> Plural form denotes supreme authority and fullness.</li><li><b>The Complexity:</b> Hints at the multi-faceted nature of the Creator.</li></ul><br/><table><thead><tr><th>Hebrew</th><th>Type</th><th>Meaning</th></tr></thead><tbody><tr><td>Elohim</td><td>Plural</td><td>Supreme Power</td></tr><tr><td>Eloah</td><td>Singular</td><td>God / Deity</td></tr></tbody></table><blockquote>“The mystery of the Creator is hidden in the grammar of His name.” – Ancient Commentary</blockquote>",

					  "text": "[Genesis 2:5] Now no shrub of the field was yet on the earth, and no plant of the field had yet sprung up, for <dn1>יהוה</dn1> <dn2>Elohim</dn2> had not sent rain on the earth, and there was no man to till the <dn7>את</dn7> ground, [6] but a mist went up from the earth and watered <dn7>את</dn7> the entire surface of the ground. [7] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> formed <dn7>את</dn7> the man out of dust from the ground, and breathed into his nostrils <kw10>breath of lives</kw10>. And the man became a living being. [8] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> planted a garden in Ěḏen, to the east, and there He put <dn7>את</dn7> the man whom He had formed. [9] And out of the ground <dn1>יהוה</dn1> <dn2>Elohim</dn2> made every tree grow that is pleasant to the sight and good for food, with <kw11>the tree of life</kw11> in the midst of the garden and <kw12>the tree of the knowledge of good and evil</kw12>. [10] Now a river went out from Ěḏen to water <dn7>את</dn7> the garden, and from there it divided and became four heads. [11] The name of the first is Pishon, it is the one surrounding <dn7>את</dn7> the entire land of Ḥavilah, where there is gold. [12] And the gold of that land is good. Bdellium is there, and the shoham stone. [13] And the name of the second river is Giḥon, it is the one surrounding <dn7>את</dn7> the entire land of Kush. [14] And the name of the third river is Ḥiddeqel, it is the one which goes toward the east of Ashshur. And the fourth river is the pherat. [15] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> took <dn7>את</dn7> the man and put him in the garden of Ěḏen to work it and to guard it. [16] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> commanded the man, saying, <dq>“<kw13>Eat</kw13> of every tree of the garden,</dq> [17] <dq>but do not eat of <kw12>the tree of the knowledge of good and evil</kw12>, for in the <kw2>day</kw2> that you eat of it <kw14>you shall certainly die</kw14>.”</dq> [18] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> said, <dq>“It is not <kw1>good</kw1> for the man to be alone, I am going to make <kw9>a helper for him, as his counterpart</kw9>.”</dq> {18.1} [19] And from the ground <dn1>יהוה</dn1> <dn2>Elohim</dn2> formed every beast of the field and every bird of the heavens, and brought them to the man to see what he would call them. And whatever the man called each living being, that was its name. [20] So the man gave names to all livestock, and to the birds of the heavens, and to every beast of the field. But for the man there was not found <kw9>a helper for him, as his counterpart</kw9>. [21] So <dn1>יהוה</dn1> <dn2>Elohim</dn2> caused a deep sleep to fall on the man, and he slept. And He took one of his <kw15>ribs</kw15> {21.1}, and closed up the flesh in its place. [22] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> made <dn7>את</dn7> the <kw16>rib</kw16> which He had taken from the man into a woman, and He brought her to the man. [23] And the man said, “Now bone of my bones and flesh of my flesh. This one is called ‘woman,’ because she was taken out of man.” [24] For this cause shall a man leave <dn7>את</dn7> his father and <dn7>את</dn7> his mother, and cleave to his wife, and they shall become <kw19>one flesh</kw19>. [25] And they were both naked, the man and his wife, and they were not ashamed.",

						  "18.1": "<h3>The Nature of the Ally (<i>Ezer</i>)</h3><p>The Hebrew term <b style='color:#00FFFF'>Ezer</b> describes a vital function rather than a specific rank. It refers to one who provides essential aid, defense, or support that the receiver cannot provide for themselves. While often translated as \"helper,\" the term \"Ally\" better captures the military and vital context of the word without forcing a hierarchy.</p><ul><li><b>The Meaning:</b> The Paleo-Hebrew roots (Eye + Weapon) depict one who sees a need and acts to defend or supply it.</li><li><b>The Spectrum of Strength:</b> The word is status-agnostic. It is used of God (Superior Aid), political alliances (Equal Aid), and here of the woman. It does not dictate that the parties are equal in strength, only that the aid is indispensable.</li><li><b>The Conclusion:</b> An ally may provide 90% of the strength or 10%; the definition holds true as long as their contribution is necessary for the mission's success.</li></ul><br/><table border='1' cellpadding='5' cellspacing='0' style='border-collapse: collapse; width: 100%;'><thead><tr style='background-color:#f3f4f6; text-align:left;'><th>Translation</th><th>Implied Rank</th><th>Theological Fit</th></tr></thead><tbody><tr><td><b>Helper</b></td><td>Fixed Subordinate</td><td><b>Limited:</b> Does not fit when God is the Helper.</td></tr><tr><td><b>Ally</b></td><td>Variable (Sup/Eq/Inf)</td><td><b>Accurate:</b> Fits God, nations, and woman interchangeably.</td></tr></tbody></table><blockquote style='border-left: 4px solid #1e40af; padding-left: 10px; margin-top: 20px; color: #555;'>“The <i>Ezer</i> is the one who supplies the lack. Whether superior or subordinate, the Ally is the essential component that moves the situation from 'not good' to 'very good'.”</blockquote>"
					  }

					  "text": "[Genesis 3:1] And the naḥash was more crafty than all the lives of the field which <dn1>יהוה</dn1> <dn2>Elohim</dn2> had made, and he said to the woman, “Is it true that <dn2>Elohim</dn2> has said, ‘Do not eat of every tree of the garden’?” [2] And the woman said to the naḥash, “We are to eat of the fruit of the trees of the garden, [3] but of the fruit of the tree which is in the midst of the garden, <dn2>Elohim</dn2> has said, ‘Do not eat of it, nor touch it, lest you die.’ ” [4] And the naḥash said to the woman, “Not dying you will die. [5] “For knows <dn2>Elohim</dn2> that in the <kw2>day</kw2> you eat of it your eyes shall be opened, and you shall be like <dn2>Elohim</dn2>, <kw20>knowing good and evil</kw20>.” [6] And the woman saw that the tree was <kw1>good</kw1> for food, that it was pleasant to the eyes, and the tree desirable to make one wise, and she took of its fruit and ate. And she also gave to her <kw21>husband</kw21> with her, and he ate. [7] Then the eyes of both of them were opened, and they knew that they were naked. And they sewed fig leaves together and made <kw22>loin coverings</kw22> for themselves. [8] And they heard <dn7>את</dn7> <dn15>the voice</dn15> of <dn1>יהוה</dn1> <dn2>Elohim</dn2> walking about in the garden in the cool of the day, and the man and his wife hid themselves from the presence of <dn1>יהוה</dn1> <dn2>Elohim</dn2> among the trees of the garden. [9] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> called unto the man and said to him, <dq>“Where are you?”</dq> [10] And he said, “I heard <dn7>את</dn7> <dn16>Your voice</dn16> in the garden, and I was afraid because I was naked, so I hid myself.” [11] And He said, <dq>“Who made you know that you were naked? Have you eaten of the tree of which I commanded you that you should not eat?”</dq> [12] And the man said, “The woman whom You gave to be with me, she gave me of the tree and I ate.” [13] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> said to the woman, <dq>“What is this you have done?”</dq> And the woman said, “The naḥash deceived me, and I ate.” [14] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> said to the naḥash, <dq>“Because you have done this, you are <kw28>cursed</kw28> more than all livestock and more than <kw23>every beast</kw23> of the field. On your belly you are to go, and eat dust all the days of your life.</dq> [15] <dq>And I put enmity between you and the woman, and between your seed and <dn19>her Seed</dn19>. <dn9>He</dn9> shall crush your head, and you shall crush <dn11>His</dn11> heel.”</dq> [16] To the woman <dn9>He</dn9> said, <dq>“<dn17>I</dn17> greatly increase your sorrow and your conception – bring forth children in pain. And your desire is for your <kw21>husband</kw21>, and he does rule over you.”</dq> [17] And to <kw24>the man</kw24> <dn9>He</dn9> said, <dq>“Because you have listened to the voice of your <kw25>wife</kw25>, and have eaten of the tree of which I commanded you, saying, ‘Do not eat of it’: “<kw28>cursed</kw28> is the ground because of you, in toil you are to eat of it all the days of your life,</dq> [18] <dq>and the ground shall bring forth thorns and thistles for you, and you shall eat <dn7>את</dn7> the herb of the field.</dq> [19] <dq>By the sweat of your face you are to eat bread until you return to the ground, for out of it you were taken. For dust you are, and to dust you return.</dq> [20] And the man called his <kw25>wife</kw25>’s name Ḥavvah, because she became the mother of all living. [21] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> made coats of skin for <kw24>the man</kw24> and his <kw25>wife</kw25> and dressed them. [22] And <dn1>יהוה</dn1> <dn2>Elohim</dn2> said, <dq>“See, the man has become like one of us, to <kw27>know good and evil</kw27>. And now, lest he put out his hand and take also of <kw11>the tree of life</kw11>, and eat, and live forever...”</dq> [23] so <dn1>יהוה</dn1> <dn2>Elohim</dn2> sent him out of the garden of Ěḏen to till <dn7>את</dn7> the ground from which he was taken, [24] and <dn9>He</dn9> drove out <dn7>את</dn7> the man. And <dn9>He</dn9> placed <dn7>את</dn7> <kw26>keruḇim</kw26> at the east of the garden of Ěḏen, and <dn7>את</dn7> a flaming sword which turned every way, to guard <dn7>את</dn7> the way to <kw11>the tree of life</kw11>.",

            ZoomIn: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="11" x2="11" y1="8" y2="14"/><line x1="8" x2="14" y1="11" y2="11"/></svg>,
            ZoomOut: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/><line x1="8" x2="14" y1="11" y2="11"/></svg>,
            CheckList: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
            Copy: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>,
            X: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            Spark: () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className="text-amber-500"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        };

        const smartFetch = async (url, type, updateStatus) => {
            try {
                // FIX: Safer URL construction to handle environments with invalid baseURIs (like about:blank)
                let resolvedUrl = url;
                try {
                    resolvedUrl = new URL(url, document.baseURI || window.location.href).href;
                } catch (e) {
                    console.warn(`[SmartFetch] URL resolution skipped for ${url}, using relative path directly.`);
                }
                
                if (resolvedUrl) console.log(`[SmartFetch] Attempting: ${resolvedUrl}`);

                const urlWithCacheBuster = `${url}?t=${new Date().getTime()}`;
                
                const response = await fetch(urlWithCacheBuster);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                updateStatus(prev => ({ ...prev, [type]: 'LIVE' }));
                return data;
            } catch (e) {
                if (DATA_VAULT[url]) {
                    console.warn(`[SmartFetch] Network/Parse failed for ${url} (Expected in Preview). Switching to Vault.`);
                    const errCode = e.message.includes('HTTP') ? e.message.split(' ')[1] : '404';
                    updateStatus(prev => ({ ...prev, [type]: `MOCK (${errCode})` }));
                    await new Promise(r => setTimeout(r, 50));
                    return DATA_VAULT[url];
                }
                
                console.error(`[SmartFetch] Critical Error loading ${url}:`, e);
                updateStatus(prev => ({ ...prev, [type]: 'ERROR' }));
                throw e; 
            }
        };

        const useTokenization = () => {
            const context = useContext(AppContext);
            if (!context) return { tokenize: (s) => s };
            const { settings, dicts, setDetail, hoveredStrong, setHoveredStrong, setNetworkStatus, searchQuery } = context;

            const substitute = (type, key) => {
                const map = dicts[type];
                const mode = settings.lang[type];
                return map?.[key]?.[mode] || key;
            };

            const highlightSearch = (text) => {
                if (!searchQuery || searchQuery.length < 2) return text;
                const parts = text.split(new RegExp(`(${searchQuery})`, 'gi'));
                return parts.map((part, i) => 
                    part.toLowerCase() === searchQuery.toLowerCase() ? 
                    <span key={i} className="bg-yellow-800 text-white rounded px-0.5">{part}</span> : part
                );
            };

            const tokenize = (str, footnotes) => {
                if (!str || typeof str !== 'string') return str;
                
                const regex = /<(dn\d+|dq|chr|pn\d+|kw\d+)>([\s\S]*?)<\/\1>|<([hg]\d+)>([\s\S]*?)<\/\3>|(\[.*?\])|\{([\w:.]+)\}|<img:([^>]+)>|<vid:([^>]+)>|<(i|b|u|sup|sub)>(.*?)<\/\9>/g;
                
                const pieces = str.split(regex);
                const elements = [];

                for (let i = 0; i < pieces.length; i += 11) {
                    elements.push(highlightSearch(pieces[i]));
                    if (pieces[i+1]) {
                        const rawTag = pieces[i+1];
                        const inner = pieces[i+2];
                        let label = inner;
                        let tagType = rawTag.substring(0, 2); 
                        if (rawTag === 'chr') tagType = 'chr'; 

                        if (tagType === 'dn' || tagType === 'pn' || tagType === 'kw') {
                            label = substitute(tagType, rawTag);
                        }
                        
                        const cls = { 
                            dn: settings.power.shekinah ? 'divine-name-styled' : '',  // Unified Shekinah Toggle Logic
                            dq: settings.power.divineQuote ? 'divine-quote-styled' : '', 
                            chr: 'char-tag text-emerald-600 font-bold', 
                            pn: 'pn-tag text-blue-400 font-bold', 
                            kw: 'font-bold' 
                        };
                        
                        elements.push(<span key={`tag-${i}`} className={cls[tagType] || ''}>{tokenize(label, footnotes)}</span>);
                    }
                    if (pieces[i+3]) {
                        const sid = pieces[i+3].toUpperCase(), inner = pieces[i+4];
                        elements.push(<span key={`str-${i}`} className={`lexical-token ${hoveredStrong === sid ? 'lexical-active' : ''}`} onMouseEnter={() => settings.power.lexical && setHoveredStrong(sid)} onMouseLeave={() => setHoveredStrong(null)} onClick={async (e) => { 
                            e.stopPropagation();
                            try { 
                                const data = await smartFetch(`data/strongs/${sid}.json`, `Lexicon Data`, setNetworkStatus); 
                                setDetail({ type: 'strongs', data }); 
                            } catch(e) { 
                                setDetail({ 
                                    type: 'strongs', 
                                    data: { lemma: sid, transliteration: "---", definition: "Definition pending...", usage: "This lexical entry has not yet been digitized." } 
                                }); 
                            } 
                        }}>{tokenize(inner, footnotes)}</span>);
                    }
                    if (pieces[i+5]) {
                        if (settings.power.verseMarkers) {
                            elements.push(<span key={`v-${i}`} className="verse-marker">{pieces[i+5]}</span>);
                        }
                    }
                    if (pieces[i+6]) {
                        const fid = pieces[i+6];
                        if (settings.power.footnoteMarkers) elements.push(<span key={`fn-${i}`} className="footnote-marker" onClick={(e) => { e.stopPropagation(); setDetail({ type: 'footnote', data: footnotes ? footnotes[fid] : fid }) }}>{"{" + fid + "}"}</span>);
                    }
                    if (pieces[i+7]) {
                        if (settings.power.imageMarkers) {
                            const imgFile = pieces[i+7];
                            elements.push(<button key={`img-${i}`} className="inline-flex mx-1 align-text-bottom" onClick={(e) => { e.stopPropagation(); setDetail({ type: 'image', data: imgFile }) }}><Icons.Image /></button>);
                        }
                    }
                    if (pieces[i+8]) {
                        if (settings.power.videoMarkers) {
                            const vidId = pieces[i+8];
                            elements.push(<button key={`vid-${i}`} className="inline-flex mx-1 align-text-bottom" onClick={(e) => { e.stopPropagation(); setDetail({ type: 'video', data: vidId }) }}><Icons.Film /></button>);
                        }
                    }
                    if (pieces[i+9]) {
                        const tag = pieces[i+9];
                        const content = pieces[i+10];
                        const key = `ed-${i}`;
                        switch(tag) {
                            case 'i': elements.push(<span key={key} className="italic text-gray-400">{highlightSearch(content)}</span>); break;
                            case 'b': elements.push(<b key={key} className="font-bold">{highlightSearch(content)}</b>); break;
                            case 'u': elements.push(<u key={key} className="underline underline-offset-4">{highlightSearch(content)}</u>); break;
                            case 'sup': elements.push(<sup key={key}>{highlightSearch(content)}</sup>); break;
                            case 'sub': elements.push(<sub key={key}>{highlightSearch(content)}</sub>); break;
                            default: elements.push(<span key={key}>{highlightSearch(content)}</span>);
                        }
                    }
                }
                return elements;
            };
            return { tokenize };
        };

        const Verse = ({ id, content, footnotes }) => {
            const { settings, selectionMode, selectedVerses, toggleVerseSelection } = useContext(AppContext);
            const { tokenize } = useTokenization();
            
            const isSelected = selectedVerses.has(id);
            const handleClick = (e) => {

                    e.stopPropagation();
                    toggleVerseSelection(id);
                }

            return (
                <span 
                    className={`verse-wrapper ${settings.power.verseHighlight && !selectionMode ? 'verse-highlight-active' : ''} ${isSelected ? 'verse-selected' : ''}`}
                    onClick={handleClick}
                >
                    {tokenize(content, footnotes)}

        };

        const Dropdown = ({ icon: Icon, label, isOpen, onToggle, children }) => {
            const dropdownRef = useRef(null);
            
            useEffect(() => {
                const handleClickOutside = (event) => {

            }, [isOpen, onToggle]);

            return (
                <div className="relative" ref={dropdownRef}>
                    <button onClick={onToggle} className={`flex items-center gap-2 p-2 rounded-xl transition-all ${isOpen ? 'bg-blue-600 text-white shadow-lg' : 'hover:bg-white/10'}`}>
                        <Icon />
                        {label && <span className="text-xs font-bold uppercase tracking-wider">{label}</span>}
                    </button>
                    {isOpen && <div className="absolute right-0 mt-3 w-64 glass-footer rounded-2xl p-4 shadow-2xl z-[150] border animate-in slide-in-from-top-2">{children}</div>}
                </div>
            );
        };

        const NetworkStatusLight = ({ status }) => {
            const values = Object.values(status);
            const isAllLive = values.every(v => v === 'LIVE');
            const hasError = values.includes('ERROR');
            const color = hasError ? 'bg-amber-500' : isAllLive ? 'bg-emerald-500' : 'bg-rose-500';
            const pulse = isAllLive ? '' : 'animate-pulse';
            return <div className={`w-3 h-3 rounded-full ${color} ${pulse} shadow-[0_0_8px_currentColor] transition-colors duration-500`}></div>;
        };

        const BibleAtlasModal = ({ isOpen, onClose, books, chapters, calendar, setDay }) => {
            const [selBook, setSelBook] = useState(null);
            const [selChapter, setSelChapter] = useState(null);
            const [search, setSearch] = useState("");
            const inputRef = useRef(null);

            useEffect(() => {
                if (isOpen && inputRef.current) inputRef.current.focus();
                if (!isOpen) { setSearch(""); setSelBook(null); setSelChapter(null); }
            }, [isOpen]);

            if (!isOpen) return null;

            const filteredBooks = books.filter(b => 
                b.bookName.toLowerCase().includes(search.toLowerCase()) || 
                b.abbreviation.toLowerCase().includes(search.toLowerCase())
            );

            const currentBook = books.find(b => b.bookId === selBook);
            const bookChapters = chapters.filter(c => c.bookId === selBook);

            return (
                <div className="atlas-modal" onClick={onClose}>
                    <div className="bg-zinc-900 text-white rounded-[2rem] shadow-2xl p-8 w-full max-w-2xl overflow-y-auto max-h-[80vh] flex flex-col" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-black text-blue-400 uppercase tracking-widest">Bible Atlas</h2>
                            <button onClick={onClose} className="p-2 text-white hover:text-blue-400">✕</button>
                        </div>
                        
                        {!selBook && (
                            <div className="relative mb-6">
                                <div className="absolute left-4 top-3.5 text-zinc-400"><Icons.Search /></div>
                                <input ref={inputRef} type="text" placeholder="Search Books..." className="w-full bg-zinc-800 text-white placeholder-zinc-500 rounded-xl py-3 pl-12 pr-4 font-bold outline-none focus:ring-2 ring-blue-600" value={search} onChange={e => setSearch(e.target.value)} />
                            </div>
                        )}

                        <div className="flex-grow overflow-y-auto">
                            {!selBook ? (
                                <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                    {filteredBooks.length > 0 ? filteredBooks.map(b => (
                                        <button key={b.bookId} onClick={() => setSelBook(b.bookId)} className="p-3 text-left bg-zinc-800 rounded-xl font-bold hover:bg-blue-600 hover:text-white transition-colors">
                                            {b.bookName}
                                        </button>
                                    )) : (
                                        <div className="col-span-full text-center opacity-40 py-8 italic">No books found matching "{search}"</div>
                                    )}
                                </div>
                            ) : !selChapter ? (
                                <div>
                                    <button onClick={() => setSelBook(null)} className="mb-4 text-xs font-black text-blue-400 uppercase flex items-center gap-2">
                                        <Icons.Left /> Back to Books
                                    </button>
                                    <h3 className="text-xl font-bold mb-4">{currentBook?.bookName}</h3>
                                    <div className="grid grid-cols-5 gap-2">
                                        {bookChapters.map(c => <button key={c.chapterNum} onClick={() => setSelChapter(c.chapterNum)} className="p-3 bg-zinc-800 rounded-xl font-bold hover:bg-blue-600 hover:text-white">{c.chapterNum}</button>)}
                                    </div>
                                </div>
                            ) : (
                                <div>
                                    <button onClick={() => setSelChapter(null)} className="mb-4 text-xs font-black text-blue-400 uppercase flex items-center gap-2">
                                        <Icons.Left /> Back to Chapters
                                    </button>
                                    <h3 className="text-xl font-bold mb-4">{currentBook?.bookName} {selChapter}</h3>
                                    <div className="space-y-2">
                                        {chapters.find(c => c.bookId === selBook && c.chapterNum === selChapter)?.dayIds.map(d => {

                                            return (
                                                <button key={d} onClick={() => { setDay(parseInt(d)); onClose(); }} className="w-full p-4 text-left bg-zinc-800 rounded-xl font-bold hover:bg-blue-600 hover:text-white flex justify-between items-center group">
                                                    <span>{planReading ? `Day ${d}: ${planReading}` : `Read on Day ${d}`}</span>
                                                    <span className="opacity-0 group-hover:opacity-100 transition-opacity"><Icons.Right /></span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const CalendarModal = ({ isOpen, onClose, activeDay, setDay }) => {
            const [view, setView] = useState('months'); 
            const [selectedMonth, setSelectedMonth] = useState(null);

            useEffect(() => { if(!isOpen) { setView('months'); setSelectedMonth(null); } }, [isOpen]);

            if (!isOpen) return null;
            
            const months = [
                { name: "January", days: 31, offset: 0 },
                { name: "February", days: 28, offset: 31 },
                { name: "March", days: 31, offset: 59 },
                { name: "April", days: 30, offset: 90 },
                { name: "May", days: 31, offset: 120 },
                { name: "June", days: 30, offset: 151 },
                { name: "July", days: 31, offset: 181 },
                { name: "August", days: 31, offset: 212 },
                { name: "September", days: 30, offset: 243 },
                { name: "October", days: 31, offset: 273 },
                { name: "November", days: 30, offset: 304 },
                { name: "December", days: 31, offset: 334 }
            ];

            return (
                <div className="atlas-modal" onClick={onClose}>
                    <div className="bg-zinc-900 text-white rounded-[2rem] shadow-2xl p-8 w-full max-w-4xl overflow-y-auto max-h-[85vh]" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="text-2xl font-black text-blue-400 uppercase tracking-widest">Chronological Cycle</h2>
                            <button onClick={onClose} className="hover:text-blue-400">✕</button>
                        </div>
                        
                        {view === 'months' ? (
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                {months.map((m, idx) => (
                                    <button key={m.name} onClick={() => { setSelectedMonth(m); setView('days'); }} className="p-6 bg-zinc-800 rounded-xl hover:bg-blue-600 hover:text-white transition-all group text-left">
                                        <div className="text-sm font-bold uppercase tracking-widest opacity-60 mb-1">{String(idx + 1).padStart(2,'0')}</div>
                                        <div className="text-xl font-bold">{m.name}</div>
                                    </button>
                                ))}
                            </div>
                        ) : (
                            <div>
                                <button onClick={() => setView('months')} className="mb-6 text-xs font-black text-blue-400 uppercase flex items-center gap-2 hover:text-white">
                                    <Icons.Left /> Back to Year
                                </button>
                                <h3 className="text-3xl font-bold mb-6">{selectedMonth.name}</h3>
                                <div className="grid grid-cols-7 gap-2">
                                    {Array.from({ length: selectedMonth.days }, (_, i) => {
                                        const d = selectedMonth.offset + i + 1;
                                        return <button key={d} onClick={() => { setDay(d); onClose(); }} className={`aspect-square rounded-xl text-sm font-bold flex items-center justify-center transition-all ${activeDay === d ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/50 scale-110' : 'bg-zinc-800 text-slate-200 hover:bg-zinc-700 hover:text-white'}`}>{i + 1}</button>;
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const DetailsPanel = ({ type, data, onClose, tokenize }) => {
            if (!data) return null;
            return (
                <div className={`details-panel ${data ? 'translate-x-0' : 'translate-x-full'}`}>
                    <div className="details-content">
                        <div className="flex justify-between items-start mb-8">
                            <div className={`text-white px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest shadow-lg ${type === 'strongs' ? 'bg-blue-600 shadow-blue-500/30' : 'bg-emerald-600 shadow-emerald-500/30'}`}>
                                {type === 'strongs' ? "Strong's Lexicon" : "Deep Dive Note"}
                            </div>
                            <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-full transition-colors">✕</button>
                        </div>
                        
                        {type === 'strongs' ? (
                            <div className="space-y-8">
                                <div>
                                    <h1 className="text-4xl font-black text-blue-400 mb-2">{data.lemma}</h1>
                                    <div className="text-xl opacity-50 font-serif italic">{data.transliteration}</div>
                                </div>
                                <div className="w-full h-px bg-zinc-800"></div>
                                <div>
                                    <h3 className="text-xs font-black uppercase tracking-widest opacity-40 mb-3">Definition</h3>
                                    <p className="text-lg leading-relaxed">{tokenize(data.definition, null)}</p>
                                </div>
                                {data.usage && (
                                    <div className="bg-zinc-800/50 p-6 rounded-2xl border border-zinc-800">
                                        <h3 className="text-xs font-black uppercase tracking-widest opacity-40 mb-3">Contextual Usage</h3>
                                        <p className="text-sm leading-relaxed opacity-80 italic">{tokenize(data.usage, null)}</p>
                                    </div>

                            </div>
                        ) : (

                                <div dangerouslySetInnerHTML={{ __html: data }} />
                            </div>
                        )}

            );
        };

        const ImageViewer = ({ file, onClose }) => {
            const [scale, setScale] = useState(1);
            if (!file) return null;
            return (
                <div className="image-viewer" onClick={onClose}>
                    <div className="relative max-w-[90vw] max-h-[90vh]" onClick={e => e.stopPropagation()}>
                        <img src={`data/images/${file}`} alt="Artifact" className="rounded-xl shadow-2xl transition-transform duration-200" style={{ transform: `scale(${scale})` }} />
                        
                        <div className="absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-black/50 backdrop-blur rounded-full p-2 border border-white/10">
                            <button onClick={() => setScale(s => Math.max(0.5, s - 0.25))} className="p-2 text-white hover:bg-white/20 rounded-full"><Icons.ZoomOut /></button>
                            <span className="text-xs font-bold text-white w-12 text-center">{Math.round(scale * 100)}%</span>
                            <button onClick={() => setScale(s => Math.min(3, s + 0.25))} className="p-2 text-white hover:bg-white/20 rounded-full"><Icons.ZoomIn /></button>
                        </div>
                        <button onClick={onClose} className="absolute -top-12 right-0 text-white p-2 hover:bg-white/10 rounded-full">✕ CLOSE</button>
                    </div>
                </div>
            );
        };

        const VideoViewer = ({ videoId, onClose }) => {
            if (!videoId) return null;
            const connector = videoId.includes('?') ? '&' : '?';
            return (
                <div className="video-viewer" onClick={onClose}>
                    <div className="relative w-full max-w-4xl aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl ring-1 ring-white/10" onClick={e => e.stopPropagation()}>
                        <iframe 
                            className="w-full h-full" 
                            src={`https://www.youtube.com/embed/${videoId}${connector}autoplay=1`} 
                            title="Video Player" 
                            frameBorder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            referrerPolicy="strict-origin-when-cross-origin"
                            allowFullScreen>
                        </iframe>
                        {/* FIX 2: Mobile-Safe Close Button inside container */}
                        <button onClick={onClose} className="absolute top-4 right-4 text-white bg-black/60 backdrop-blur-md border border-white/20 shadow-lg px-4 py-2 hover:bg-red-600/80 rounded-full flex items-center gap-2 font-bold text-xs uppercase tracking-widest z-50 transition-all">
                            <span>Close</span> <Icons.X />
                        </button>
                    </div>
                </div>
            );
        };

        const EngineView = () => {
            const context = useContext(AppContext);
            const { settings, setSettings, dicts, activeDay, setActiveDay, pageData, detail, setDetail, menu, setMenu, error, networkStatus, selectionMode, setSelectionMode, selectedVerses, setSelectedVerses, searchQuery, setSearchQuery } = context;
            const { tokenize } = useTokenization();
            const [view, setView] = useState({ atlas: false, calendar: false });
            const searchInputRef = useRef(null);

            const updatePower = (key) => setSettings(s => ({...s, power: {...s.power, [key]: !s.power[key]}}));
            const cycleLang = (key, opts) => setSettings(s => {
                const cur = s.lang[key];
                const next = opts[(opts.indexOf(cur) + 1) % opts.length];
                return {...s, lang: {...s.lang, [key]: next}};
            });

            const copyVerses = async () => {
                const textToCopy = Array.from(selectedVerses).sort((a,b) => {
                    const getNum = id => parseInt(id.split('-').pop());
                    return getNum(a) - getNum(b);
                }).map(id => {
                    const el = document.getElementById(`verse-${id}`);
                    return el ? el.innerText : ""; 
                })
                .join('\n\n')
                .replace(/\{.*?\}/g, '') // Strip footnotes
                .replace(/\s+/g, ' ') // Collapse multiple spaces
                .replace(/\n\s*\n/g, '\n') // Normalize line breaks
                .trim();
                
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    setSelectionMode(false);
                    setSelectedVerses(new Set());
                    alert("Verses copied to clipboard!");
                } catch (err) {
                    try {
                        const textArea = document.createElement("textarea");
                        textArea.value = textToCopy;
                        textArea.style.position = "fixed"; 
                        textArea.style.left = "-9999px";
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        setSelectionMode(false);
                        setSelectedVerses(new Set());
                        alert("Verses copied to clipboard!");
                    } catch (fallbackErr) {
                        console.error("Copy failed:", fallbackErr);
                        alert("Failed to copy. Please try selecting text manually.");
                    }
                }
            };

            const toggleSearch = () => {
                if (menu === 'search') {
                    setMenu(null);
                    setSearchQuery("");
                } else {
                    setMenu('search');
                    setTimeout(() => searchInputRef.current?.focus(), 100);
                }
            };

            const toggleSelectionMode = () => {
                setSelectionMode(!selectionMode);
                setSelectedVerses(new Set());
            };

            const formattedDate = useMemo(() => {
                const dayInfo = dicts.calendar?.find(d => parseInt(d.dayId) === activeDay);
                if (!dayInfo?.dateString) return `DAY ${activeDay}`;
                
                const year = parseInt(dayInfo.dateString.substring(0, 4));
                const month = parseInt(dayInfo.dateString.substring(4, 6)) - 1; 
                const day = parseInt(dayInfo.dateString.substring(6, 8));
                
                const date = new Date(year, month, day);
                return new Intl.DateTimeFormat('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }).format(date).toUpperCase();
            }, [activeDay, dicts.calendar]);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowLeft') setActiveDay(prev => Math.max(1, prev - 1));
                    if (e.key === 'ArrowRight') setActiveDay(prev => Math.min(365, prev + 1));
                    if (e.key === 'Escape') { setDetail(null); setView({ atlas: false, calendar: false }); setMenu(null); setSearchQuery(""); setSelectionMode(false); }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const filteredNetworkStatus = useMemo(() => {
                const globalKeys = ['Divine Names', 'Proper Names', 'Key Words', 'Book Index', 'Chapter Map', 'Calendar', 'Lexicon Data'];
                const dayKey = `Day ${activeDay}`;
                return Object.fromEntries(Object.entries(networkStatus).filter(([k]) => globalKeys.includes(k) || k === dayKey || k.startsWith('Image') || k.startsWith('Video')));
            }, [networkStatus, activeDay]);

            return (
                <div className={`min-h-screen flex flex-col transition-colors duration-500 bg-zinc-950 text-white dark-mode ${settings.power.shekinah ? 'shekinah-mode' : ''}`}>
                    <header className="sticky top-0 z-[110] glass-header px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center gap-3">
                            <button onClick={() => setView({ ...view, calendar: true })} className="p-2 hover:bg-white/10 rounded-lg"><Icons.Calendar /></button>
                            <button onClick={() => setView({ ...view, atlas: true })} className="p-2 hover:bg-white/10 rounded-lg"><Icons.Compass /></button>
                            <div className="h-5 w-px bg-zinc-800 mx-2"></div>
                            <button onClick={() => setActiveDay(Math.max(1, activeDay-1))} className="p-2 hover:bg-white/10 rounded-lg"><Icons.Left /></button>
                            <button onClick={() => setActiveDay(Math.min(365, activeDay+1))} className="p-2 hover:bg-white/10 rounded-lg"><Icons.Right /></button>
                        </div>
                        
                        <div className="flex items-center gap-2">
                            <button onClick={toggleSearch} className={`p-2 rounded-lg ${menu === 'search' ? 'bg-blue-900/40 text-blue-400' : 'hover:bg-white/10'}`}>
                                <Icons.Search />
                            </button>
                            
                            <button onClick={toggleSelectionMode} className={`p-2 rounded-lg ${selectionMode ? 'bg-amber-900/40 text-amber-400' : 'hover:bg-white/10'}`}>
                                <Icons.CheckList />
                            </button>

                            <Dropdown icon={() => <NetworkStatusLight status={filteredNetworkStatus} />} isOpen={menu === 'network'} onToggle={() => setMenu(menu === 'network' ? null : 'network')}>
                                <div className="space-y-3">
                                    <h3 className="text-[10px] font-black uppercase tracking-widest opacity-40">Data Stream</h3>
                                    {Object.entries(filteredNetworkStatus).map(([key, val]) => (
                                        <div key={key} className="flex justify-between items-center text-xs">
                                            <span className="font-bold opacity-70 truncate max-w-[120px]">{key}</span>
                                            <span className={`px-1.5 py-0.5 rounded text-[9px] font-black tracking-wider ${val === 'LIVE' ? 'bg-emerald-900/40 text-emerald-400' : 'bg-rose-900/40 text-rose-400'}`}>{val}</span>
                                        </div>
                                    ))}
                                </div>
                            </Dropdown>

                            <Dropdown icon={Icons.Power} isOpen={menu === 'power'} onToggle={() => setMenu(menu === 'power' ? null : 'power')}>
                                <div className="space-y-4">
                                    {/* Consolidated Shekinah Toggle */}
                                    <div className="flex justify-between items-center text-sm font-bold mt-2 text-amber-400">
                                        <div className="flex items-center gap-2"><Icons.Spark /><span className="capitalize">Shekinah</span></div>
                                        <button onClick={() => updatePower('shekinah')} className={`w-9 h-5 rounded-full relative transition-colors ${settings.power.shekinah ? 'bg-amber-500' : 'bg-slate-300'}`}><div className={`w-4 h-4 bg-white rounded-full absolute top-0.5 transition-transform duration-200 ${settings.power.shekinah ? 'translate-x-[18px]' : 'translate-x-[2px]'}`}></div></button>
                                    </div>

                                    {/* Divine Quote moved to second position with custom styling */}
                                    <div className="flex justify-between items-center text-sm font-bold mt-2 text-rose-400">
                                        <div className="flex items-center gap-2"><Icons.Spark className="text-rose-500" /><span className="capitalize">Divine Quote</span></div>
                                        <button onClick={() => updatePower('divineQuote')} className={`w-9 h-5 rounded-full relative transition-colors ${settings.power.divineQuote ? 'bg-rose-500' : 'bg-slate-300'}`}><div className={`w-4 h-4 bg-white rounded-full absolute top-0.5 transition-transform duration-200 ${settings.power.divineQuote ? 'translate-x-[18px]' : 'translate-x-[2px]'}`}></div></button>
                                    </div>

                                    <div className="border-t border-slate-700 my-2"></div>
                                    
                                    <h3 className="text-[10px] font-black uppercase tracking-widest opacity-40">Highlighting</h3>
                                    {['verseHighlight', 'lexical'].map(k => (
                                        <div key={k} className="flex justify-between items-center text-sm font-bold"><span className="capitalize">{k.replace(/([A-Z])/g, ' $1')}</span><button onClick={() => updatePower(k)} className={`w-9 h-5 rounded-full relative transition-colors ${settings.power[k] ? 'bg-blue-600' : 'bg-slate-300'}`}><div className={`w-4 h-4 bg-white rounded-full absolute top-0.5 transition-transform duration-200 ${settings.power[k] ? 'translate-x-[18px]' : 'translate-x-[2px]'}`}></div></button></div>
                                    ))}
                                    <div className="border-t border-slate-700 pt-4">
                                        {['verseMarkers', 'footnoteMarkers'].map(k => (
                                            <div key={k} className="flex justify-between items-center text-sm font-bold mt-2"><span className="capitalize">{k.replace(/([A-Z])/g, ' $1')}</span><button onClick={() => updatePower(k)} className={`w-9 h-5 rounded-full relative transition-colors ${settings.power[k] ? 'bg-blue-600' : 'bg-slate-300'}`}><div className={`w-4 h-4 bg-white rounded-full absolute top-0.5 transition-transform duration-200 ${settings.power[k] ? 'translate-x-[18px]' : 'translate-x-[2px]'}`}></div></button></div>
                                        ))}
                                        <div className="flex justify-between items-center text-sm font-bold mt-2"><span className="capitalize">Image Markers</span><button onClick={() => updatePower('imageMarkers')} className={`w-9 h-5 rounded-full relative transition-colors ${settings.power.imageMarkers ? 'bg-blue-600' : 'bg-slate-300'}`}><div className={`w-4 h-4 bg-white rounded-full absolute top-0.5 transition-transform duration-200 ${settings.power.imageMarkers ? 'translate-x-[18px]' : 'translate-x-[2px]'}`}></div></button></div>
                                        <div className="flex justify-between items-center text-sm font-bold mt-2"><span className="capitalize">Video Markers</span><button onClick={() => updatePower('videoMarkers')} className={`w-9 h-5 rounded-full relative transition-colors ${settings.power.videoMarkers ? 'bg-blue-600' : 'bg-slate-300'}`}><div className={`w-4 h-4 bg-white rounded-full absolute top-0.5 transition-transform duration-200 ${settings.power.videoMarkers ? 'translate-x-[18px]' : 'translate-x-[2px]'}`}></div></button></div>
                                    </div>
                                </div>
                            </Dropdown>
                            <Dropdown icon={Icons.Scroll} isOpen={menu === 'scroll'} onToggle={() => setMenu(menu === 'scroll' ? null : 'scroll')}>
                                <div className="space-y-4">
                                    {['dn', 'pn', 'kw'].map(k => (
                                        <div key={k} className="flex justify-between items-center text-xs font-black text-zinc-300 uppercase">
                                            {k === 'dn' ? 'Divine Name' : k === 'pn' ? 'Proper Names' : 'Key Words'} 
                                            <button 
                                                onClick={() => cycleLang(k, k === 'dn' ? ['native', 'transliterated', 'anglicized'] : k === 'pn' ? ['transliterated', 'anglicized'] : ['traditional', 'modernized'])} 
                                                className="bg-blue-600 text-white px-2 py-1 rounded capitalize"
                                            >
                                                {settings.lang[k]}
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </Dropdown>
                        </div>
                    </header>

                    <main className="flex-grow silver-table p-4 md:p-12">
                        <div className="parchment max-w-4xl mx-auto rounded-[3rem] p-8 md:p-20 font-serif min-h-[85vh]">
                            {pageData ? (
                                <>
                                    <div className="text-center mb-16 opacity-30 text-[10px] font-black uppercase tracking-[0.4em]">{formattedDate}</div>
                                    {pageData.readings.map((r, i) => (
                                        <div key={i} className="space-y-10 mb-20">
                                            {r.section && <div><h1 className="section-label">{r.section}</h1><div className="gradient-bar-section"></div></div>}
                                            {r.subsection && <h2 className="subsection-label">{r.subsection}</h2>}
                                            {r.title && <div><h3 className="title-label">{r.title}</h3><div className="gradient-bar-title"></div></div>}
                                            {r.subtitle && <h4 className="subtitle-label">{r.subtitle}</h4>}
                                            {r.chronological && <p className="chronological-label">{r.chronological}</p>}
                                            {r.references && <p className="references-label">{r.references.split(/([1-3]?\s?[A-Za-z]+\s\d+:\d+(?:-\d+)?)/).map((p, k) => <span key={k} className={/([1-3]?\s?[A-Za-z]+\s\d+:\d+(?:-\d+)?)/.test(p) ? 'ref-purple' : ''}>{p}</span>)}</p>}
                                            <div className="bible-text">
                                                {r.text.split(/(\[.*?\])/).filter(Boolean).reduce((acc, part, idx, arr) => {
                                                    if (part.startsWith('[')) acc.push({ marker: part, content: arr[idx + 1] || "" });
                                                    else if (idx === 0 && !arr[idx].startsWith('[')) acc.push({ marker: "", content: part });
                                                    return acc;
                                                }, []).map((v, idx) => {
                                                    const verseId = `${i}-${idx}`;
                                                    return <span id={`verse-${verseId}`} key={idx}><Verse id={verseId} content={v.marker + v.content} footnotes={r.footnotes} /></span>
                                                })}
                                            </div>
                                        </div>
                                    ))}
                                </>
                            ) : (
                                <div className="h-full flex flex-col items-center justify-center py-40 gap-4">
                                    <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                                    <div className="max-w-md text-center">
                                        <div className="font-black uppercase tracking-widest opacity-30 mb-4">{error ? "Connection Snag" : "Synchronizing Library..."}</div>
                                        {error && <div className="text-red-500 text-sm font-sans bg-red-950/20 p-6 rounded-2xl border border-red-100">
                                            <p className="font-bold mb-2">Browser Security block detected.</p>
                                            <p className="opacity-80 leading-relaxed italic">The engine cannot fetch files directly from your hard drive due to CORS security. <br/><br/>To fix this, please run this project using a local web server (e.g., VS Code's "Live Server" extension).</p>
                                        </div>}
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* FIX 3: Persistent Floating Search Pill */}
                    <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 z-[180] transition-all duration-300 ${menu === 'search' ? 'translate-y-0 opacity-100' : 'translate-y-20 opacity-0 pointer-events-none'}`}>
                        <div className="bg-zinc-900/90 backdrop-blur-xl border border-zinc-700 shadow-2xl rounded-full p-2 pl-6 flex items-center gap-4 w-[90vw] max-w-lg">
                            <Icons.Search />
                            <input 
                                ref={searchInputRef}
                                type="text" 
                                placeholder="Search in scroll..." 
                                className="flex-grow bg-transparent outline-none text-slate-100 placeholder-slate-400 font-medium"
                                value={searchQuery}
                                onChange={(e) => setSearchQuery(e.target.value)}
                            />
                            <div className="h-6 w-px bg-zinc-700"></div>
                            <button onClick={() => { setSearchQuery(""); setMenu(null); }} className="p-2 hover:bg-zinc-800 rounded-full text-slate-500 hover:text-red-500 transition-colors">
                                <Icons.X />
                            </button>
                        </div>
                    </div>

                    {/* Floating Action Bar for Selection Mode */}
                    {selectionMode && selectedVerses.size > 0 && (
                        <div className="fixed bottom-8 left-1/2 -translate-x-1/2 z-[190] animate-in slide-in-from-bottom-4">
                            <div className="bg-zinc-900 text-white rounded-full shadow-2xl p-2 px-6 flex items-center gap-4 border border-zinc-700">
                                <span className="font-bold text-sm">{selectedVerses.size} Selected</span>
                                <div className="h-4 w-px bg-zinc-700"></div>
                                <button onClick={copyVerses} className="flex items-center gap-2 hover:text-blue-400 font-bold text-sm uppercase tracking-wider">
                                    <Icons.Copy /> Copy
                                </button>
                                <button onClick={() => setSelectedVerses(new Set())} className="hover:text-red-400">✕</button>
                            </div>
                        </div>
                    )}

                    <BibleAtlasModal isOpen={view.atlas} onClose={() => setView({...view, atlas: false})} books={dicts.books || []} chapters={dicts.chapters || []} calendar={dicts.calendar || []} setDay={setActiveDay} />
                    <CalendarModal isOpen={view.calendar} onClose={() => setView({...view, calendar: false})} activeDay={activeDay} setDay={setActiveDay} />

                    {/* Unified Details Panel (Handles Lexicon & Footnotes) */}
                    <DetailsPanel type={detail?.type} data={detail?.data} onClose={() => setDetail(null)} tokenize={tokenize} />

                    {detail && detail.type === 'image' && (
                        <ImageViewer file={detail.data} onClose={() => setDetail(null)} />
                    )}
                    {detail && detail.type === 'video' && (
                        <VideoViewer videoId={detail.data} onClose={() => setDetail(null)} />
                    )}
                </div>
            );
        };

        const App = () => {
            const [settings, setSettings] = useState({ 
                dark: true, 
                power: { 
                    verseHighlight: true, 
                    lexical: true, 
                    shekinah: true, // Consolidated Toggle
                    divineQuote: true, 
                    verseMarkers: true, 
                    footnoteMarkers: true, 
                    imageMarkers: true, 
                    videoMarkers: true
                }, 
                lang: { 
                    dn: 'transliterated', 
                    pn: 'transliterated', 
                    kw: 'modernized' 
                } 
            });
            const [dicts, setDicts] = useState({ dn: {}, pn: {}, kw: {}, books: [], chapters: [], calendar: [] });
            const [activeDay, setActiveDay] = useState(1);
            const [pageData, setPageData] = useState(null);
            const [detail, setDetail] = useState(null);
            const [menu, setMenu] = useState(null);
            const [hoveredStrong, setHoveredStrong] = useState(null);
            const [error, setError] = useState(null);
            const [networkStatus, setNetworkStatus] = useState({});
            
            const [searchQuery, setSearchQuery] = useState("");
            const [selectionMode, setSelectionMode] = useState(false);
            const [selectedVerses, setSelectedVerses] = useState(new Set());

            const toggleVerseSelection = (id) => {
                setSelectedVerses(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            useEffect(() => {
                const init = async () => {
                    try {
                        const [dn, pn, kw, books, chapters, calendar] = await Promise.all([
                            smartFetch('data/language/divine_names.json', 'Divine Names', setNetworkStatus),
                            smartFetch('data/language/proper_names.json', 'Proper Names', setNetworkStatus),
                            smartFetch('data/language/key_words.json', 'Key Words', setNetworkStatus),
                            smartFetch('data/books.json', 'Book Index', setNetworkStatus),
                            smartFetch('data/chapters.json', 'Chapter Map', setNetworkStatus),
                            smartFetch('data/calendar.json', 'Calendar', setNetworkStatus)
                        ]);
                        
                        if (calendar && calendar.length > 0 && !calendar[0].reading) {
                            console.log("[App] Hydrating calendar data with client-side metadata...");
                            const PLAN_MAP = { "1": "Genesis 1:1–2:3" };
                            calendar.forEach(day => {
                                if (PLAN_MAP[day.dayId]) {
                                    day.reading = PLAN_MAP[day.dayId];
                                }
                            });
                        }

                        setDicts({ dn, pn, kw, books, chapters, calendar });
                    } catch (e) { setError(e.toString()); }
                };
                init();
            }, []);

            useEffect(() => {
                const load = async () => {
                    try {
                        const dayFile = `data/readings/day${String(activeDay).padStart(3, '0')}.json`;
                        const data = await smartFetch(dayFile, `Day ${activeDay}`, setNetworkStatus);
                        setPageData(data);
                        setError(null);
                    } catch (e) { 
                        console.log("Caught fetch error for day:", activeDay);
                        setPageData({
                            dayid: String(activeDay),
                            readings: [{
                                title: "Content Pending",
                                subtitle: "This portion of the scroll is yet to be unsealed.",
                                text: "Stay tuned for future updates."
                            }]
                        });
                        setError(null);
                    }
                };
                load();
            }, [activeDay]);

            return (<AppContext.Provider value={{ settings, setSettings, dicts, activeDay, setActiveDay, pageData, detail, setDetail, menu, setMenu, hoveredStrong, setHoveredStrong, error, networkStatus, setNetworkStatus, searchQuery, setSearchQuery, selectionMode, setSelectionMode, selectedVerses, setSelectedVerses, toggleVerseSelection }}><EngineView /></AppContext.Provider>);
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
